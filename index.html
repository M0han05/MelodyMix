<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelodyMix | Your Ultimate Music Playlist</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="images/cover1.jpg">
</head>
<body>
    <nav class="sidebar">
        <div class="logo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="var(--primary-color)">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
            <span>MelodyMix</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html" class="active"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> <span>Home</span></a></li>
            <li><a href="explore.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg> <span>Explore</span></a></li>
            <li><a href="about.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg> <span>About</span></a></li>
            <li><a href="contact.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg> <span>Contact</span></a></li>
            <li><a href="faq.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg> <span>FAQ</span></a></li>
        </ul>
    </nav>

    <main class="main-content">
        <header>
            <input type="text" class="search-bar" placeholder="Search for songs, artists...">
        </header>

        <section class="hero">
            <h1>Welcome to MelodyMix</h1>
            <p>Your personalized music destination. Stream the best hits across all languages.</p>
        </section>

        <section class="home-section">
            <div class="section-title" style="display: flex; justify-content: space-between; align-items: center;">
                <h2>Featured Today</h2>
                <a href="explore.html" style="color: var(--primary); text-decoration: none; font-size: 14px; font-weight: bold;">Show all</a>
            </div>
            <div id="featuredGrid" class="song-grid">
                <!-- Top 6 songs injected by JS -->
            </div>
        </section>

        <section class="home-section" style="margin-top: 40px;">
            <div class="section-title">
                <h2>Browse by Mood</h2>
            </div>
            <div class="genre-cards">
                <div class="genre-card" style="background: #E8115B;" onclick="window.location.href='explore.html?genre=feel good'">Feel Good</div>
                <div class="genre-card" style="background: #148A08;" onclick="window.location.href='explore.html?genre=motivation'">Motivation</div>
                <div class="genre-card" style="background: #BC5900;" onclick="window.location.href='explore.html?genre=phonk'">Phonk</div>
                <div class="genre-card" style="background: #477D95;" onclick="window.location.href='explore.html?genre=melancholic'">Melancholic</div>
            </div>
        </section>
    </main>

    <div class="player-bar">
        <div class="current-song">
            <img src="https://images.unsplash.com/photo-1514525253344-f814d07d67e7?w=400" alt="Cover">
            <div class="current-song-info">
                <h4>No Song Selected</h4>
                <p>Select a song to play</p>
            </div>
        </div>
        <div class="player-controls">
            <div class="control-btns">
                <button><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                <button class="play-pause" onclick="window.player.togglePlay()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="black">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </button>
                <button><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6z"/></svg></button>
            </div>
            <div class="progress-container">
                <span class="current-time">0:00</span>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <span class="total-time">0:00</span>
            </div>
        </div>
        <div class="volume-controls">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--text-muted)"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <div class="volume-bar-container">
                <div class="volume-fill"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/player.js"></script>
</body>
</html>
